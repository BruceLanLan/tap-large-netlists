# Solidity reference implementation of the draft TAP "Large Netlists and Verifiable Execution" (tapnet/2).
# Gas figures in the TAP are measured with exactly these settings.
[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 10000
evm_version = "shanghai"
bytecode_hash = "none"
cbor_metadata = false
gas_limit = "18446744073709551615"
memory_limit = 1073741824
fs_permissions = [{ access = "read", path = "../assets/tap-draft-large-netlists" }, { access = "read", path = "../demo/cartridge/build" }, { access = "read", path = "../demo/inference/build" }, { access = "read", path = "../demo/inference/onchain" }, { access = "read-write", path = "./test/data" }, { access = "read-write", path = "./deployments" }]

[fuzz]
runs = 256

[lint]
lint_on_build = false
