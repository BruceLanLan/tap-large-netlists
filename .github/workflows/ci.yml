name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  FOUNDRY_VERSION: v1.8.3
  FORGE_STD_TAG: v1.17.0

jobs:
  python:
    name: Python ${{ matrix.suite.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11"]
        suite:
          - { name: assets,    dir: assets/tap-draft-large-netlists, cmd: "python make_vectors.py --check && python test_tapnet2.py && python test_ram.py" }
          - { name: cartridge, dir: demo/cartridge,                  cmd: "python test_cartridge.py" }
          - { name: inference, dir: demo/inference,                  cmd: "python test_inference.py && python mlp_report.py" }
          - { name: fixtures,  dir: contracts/test/data,             cmd: "python gen_diff.py && python game_gen.py" }
          - { name: attacks,   dir: measurements/attacks,            cmd: "python attack1.py && python attack2.py && python attack3.py" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run suite
        working-directory: ${{ matrix.suite.dir }}
        run: ${{ matrix.suite.cmd }}
      - name: Generated files must match the committed ones
        run: git diff --exit-code

  forge:
    name: Foundry build + test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install forge-std (not committed, see contracts/lib/README.md)
        run: git clone --depth 1 --branch "$FORGE_STD_TAG" https://github.com/foundry-rs/forge-std contracts/lib/forge-std
      - uses: foundry-rs/foundry-toolchain@v1.9.1
        with:
          version: ${{ env.FOUNDRY_VERSION }}
      - name: forge build
        working-directory: contracts
        run: forge build
      - name: forge test
        working-directory: contracts
        run: forge test
      - name: Deployment script, anvil dry run (DEPLOY.md §8; local node, anvil's public dev key)
        working-directory: contracts
        run: ./script/anvil-dry-run.sh
      - name: Gas outputs must match the committed ones
        run: git diff --exit-code

  verilog2tapnet:
    name: verilog2tapnet (Yosys + Icarus Verilog)
    runs-on: ubuntu-24.04
    env:
      OSS_CAD_SUITE_TAG: "2026-10-07"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Pinned OSS CAD Suite nightly (bundles Yosys, ABC, Icarus Verilog). The Ubuntu 24.04 package is
      # Yosys 0.33, whose ABC maps structurally identical designs to equivalent but not identical NAND
      # records; the converter documents Yosys >= 0.69 (tools/verilog2tapnet/README.md). Only bin/ goes on
      # PATH: the bundle's own python3 is reachable there only as tabbypy3, so setup-python stays in charge.
      - name: Install Yosys and Icarus Verilog (OSS CAD Suite ${{ env.OSS_CAD_SUITE_TAG }})
        run: |
          stamp="${OSS_CAD_SUITE_TAG//-/}"
          url="https://github.com/YosysHQ/oss-cad-suite-build/releases/download/${OSS_CAD_SUITE_TAG}/oss-cad-suite-linux-x64-${stamp}.tgz"
          echo "Downloading $url"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/oss-cad-suite.tgz" "$url"
          tar -xzf "$RUNNER_TEMP/oss-cad-suite.tgz" -C "$RUNNER_TEMP"
          rm "$RUNNER_TEMP/oss-cad-suite.tgz"
          echo "$RUNNER_TEMP/oss-cad-suite/bin" >> "$GITHUB_PATH"
      - name: Tool versions
        run: |
          which yosys iverilog vvp python
          yosys -V
          iverilog -V 2>&1 | head -n 1 || true
          vvp -V 2>&1 | head -n 1 || true
          python --version
      - name: Unit tests (convert, validate beat by beat against iverilog, RAM contents, rejections)
        working-directory: tools/verilog2tapnet
        run: python -m unittest discover -s tests -v
      - name: Inference demo (a fresh conversion of rtl/mlp_digits.v behaves like the integer model)
        working-directory: demo/inference
        run: python -m unittest -v test_inference.ConverterTests
